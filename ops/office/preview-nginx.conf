# 放入外层 Nginx http 块，替换域名、证书和网关服务名。主站仍使用原有路由。
map $http_upgrade $office_upgrade_connection { default upgrade; '' close; }
map $uri $office_affinity {
    default "invalid";
    "~^/s/(?<office_sid>[a-f0-9]{32})/" $office_sid;
}
upstream office_gateway {
    hash $office_affinity consistent;
    server kb-gateway:8080;
    # 多副本在此增加 server；始终按 SID 粘滞，不按连接 Cookie 原文分流。
}
server {
    listen 443 ssl;
    server_name preview.example.invalid;
    ssl_certificate /etc/nginx/tls/preview.crt;
    ssl_certificate_key /etc/nginx/tls/preview.key;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 4m;
    location /s/ {
        proxy_pass http://office_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host preview.example.invalid;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $office_upgrade_connection;
        proxy_set_header satoken "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 40s;
        proxy_connect_timeout 2s;
        proxy_intercept_errors off;
    }
    location / { return 404; }
}
