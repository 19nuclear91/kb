# 只连接私有容器网络；kb-app 为实际应用服务 DNS 名，不发布本代理端口。
server {
    listen 80;
    server_name office-source;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 1k;
    location ~ "^/internal/office-preview/sessions/[a-f0-9]{32}/source$" {
        if ($request_method != GET) { return 404; }
        if ($args != "") { return 404; }
        proxy_pass http://kb-app:8081;
        proxy_pass_request_headers off;
        proxy_set_header Host office-source;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control no-store always;
    }
    location / { return 404; }
}
